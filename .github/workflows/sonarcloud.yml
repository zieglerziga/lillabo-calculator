name: SonarCloud

on:
  pull_request:
    types: [ opened, synchronize ]
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_ORGANIZATION: "zieglerziga"
  SONAR_PROJECT_KEY: "lillabo-calculator"
jobs:
  sonarcloud:
    name: Test and Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Validate SonarCloud configuration
        run: |
          test -n "${{ secrets.SONAR_TOKEN }}" || { echo "Missing SONAR_TOKEN secret"; exit 1; }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pytest-cov

      - name: Run tests and produce coverage report
        run: |
          pytest -m "not slow" --cov=lillabo_calculator --cov-report=xml --cov-report=term

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} -Dsonar.sources=src
            -Dsonar.tests=tests -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300
            -Dsonar.python.version=3.13
